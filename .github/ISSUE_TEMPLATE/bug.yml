name: 버그 제보
description: k-mods의 mod나 설치가 기대대로 동작하지 않아요.
title: "[버그] "
labels: ["버그"]
body:
  - type: input
    id: mod
    attributes:
      label: mod 이름
      placeholder: streamer-mode
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Claude Code 버전
      description: "`claude --version` 결과"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 어디서 쓰나요
      options:
        - 터미널
        - 데스크톱 앱 (Code 탭)
        - VS Code 등 에디터 안 터미널
        - 기타
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요?
      description: 기대한 것과 실제로 본 것. 스크린샷이 있으면 붙여 주세요. 토큰·개인정보는 지워 주세요.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 로그 (선택)
      description: "`claude --plugin-dir` 세션의 `refused:`·`skipped:` 줄이나 디버그 로그"
      render: text
